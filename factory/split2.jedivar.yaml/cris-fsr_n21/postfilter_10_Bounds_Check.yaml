       # ------------------------
       # Step 17: Useflag Check
       # ------------------------
       - filter: Bounds Check
         filter variables:
         - name: brightnessTemperature
           channels: *cris-fsr_n21_channels
         test variables:
         - name: ObsFunction/ChannelUseflagCheckRad
           channels: *cris-fsr_n21_channels
           options:
             channels: *cris-fsr_n21_channels
             use_flag: *cris-fsr_n21_use_flag
         minvalue: 1.0e-12
         actions:
         - name: set
           flag: UseflagCheck
           ignore: rejected observations
         - name: reject
