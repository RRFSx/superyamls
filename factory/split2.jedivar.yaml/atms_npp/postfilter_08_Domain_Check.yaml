       # Toss the data if the hofx is missing or outside of range
       - filter: Domain Check
         filter variables:
         - name: brightnessTemperature
           channels: *atms_npp_channels
         where:
         - variable:
             name: HofX/brightnessTemperature
             channels: *atms_npp_channels
           value: is_valid
           minvalue: 50.00001
           maxvalue: 449.99999
         action:
           name: reject

