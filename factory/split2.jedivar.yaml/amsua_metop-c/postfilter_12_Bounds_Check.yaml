       #  Inter-channel check
       - filter: Bounds Check
         filter variables:
         - name: brightnessTemperature
           channels: *amsua_metop-c_channels
         test variables:
         - name: ObsFunction/InterChannelConsistencyCheck
           channels: *amsua_metop-c_channels
           options:
             channels: *amsua_metop-c_channels
             sensor: amsua_metop-c
             use_flag: *amsua_metop-c_use_flag
         maxvalue: 1.0e-12
         action:
           name: reject
