       # ----------------------------------
       # Step 4: Create cloudFree variable
       # ----------------------------------
       - filter: Variable Assignment
         assignments:
         - name: DerivedMetaData/cloudFree
           type: int
           function:
             name: IntObsFunction/Arithmetic
             options:
               variables:
               - name: MetaData/cloudCoverTotal
               coefs: [-1]
               intercept: 100

