       #  Inter-channel check
       - filter: Bounds Check
         filter variables:
         - name: brightnessTemperature
           channels: *amsua_n19_channels
         test variables:
         - name: ObsFunction/InterChannelConsistencyCheck
           channels: *amsua_n19_channels
           options:
             channels: *amsua_n19_channels
             sensor: amsua_n19
             use_flag: *amsua_n19_use_flag
         maxvalue: 1.0e-12
         action:
           name: reject
