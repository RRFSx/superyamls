       # -------------------------------
       # Step 22: Useflag Check
       # -------------------------------
       - filter: Bounds Check
         filter variables:
         - name: brightnessTemperature
           channels: *abi_g18_channels
         test variables:
         - name: ObsFunction/ChannelUseflagCheckRad
           channels: *abi_g18_channels
           options:
             channels: *abi_g18_channels
             use_flag: *abi_g18_use_flag
         minvalue: 1.0e-12
         actions:
           - name: set
             flag: UseflagCheck
             ignore: rejected observations
           - name: reject

